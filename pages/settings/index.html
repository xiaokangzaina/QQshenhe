<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>群审核策略控制台</title>
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <div class="page-shell">
        <section class="workspace-shell">
            <header class="top-hero">
                <div class="hero-copy">
                    <div class="eyebrow">Group AIP Review Console</div>
                    <h1>群审核策略控制台</h1>
                    <p>集中管理群级 AI 审核、违规处置、通知策略与提示词模板。</p>
                </div>
                <div class="hero-actions">
                    <button class="ghost-button" id="toggleThemeBtn">主题: 自动</button>
                    <button class="primary-button" id="addGroupBtn">添加群配置</button>
                </div>
            </header>

            <div class="workspace-grid">
                <aside id="groupListPanel" class="group-list-panel glass-card">
                    <div class="panel-title-row">
                        <div>
                            <div class="panel-kicker">配置列表</div>
                            <div class="panel-title">审核群组</div>
                        </div>
                        <span class="count-pill" id="groupListCount">0 个群配置</span>
                    </div>

                    <div class="quick-stats">
                        <div class="quick-stat">
                            <span id="overviewTotal">0</span>
                            <small>群配置</small>
                        </div>
                        <div class="quick-stat success">
                            <span id="overviewEnabled">0</span>
                            <small>已启用</small>
                        </div>
                        <div class="quick-stat warn">
                            <span id="overviewDisabled">0</span>
                            <small>未启用</small>
                        </div>
                    </div>

                    <label class="toolbar-field search-shell">
                        <span class="search-icon">⌕</span>
                        <input id="groupSearchInput" type="search" placeholder="搜索群名或群号" aria-label="搜索群" />
                    </label>

                    <div class="list-meta-row">
                        <span>点击左侧群卡片编辑单群策略</span>
                    </div>

                    <div id="groupList" class="group-list empty-state">
                        群配置列表加载后会显示在这里。
                    </div>
                </aside>

                <section id="groupDetailPanel" class="group-detail-panel glass-card">
                    <div id="groupDetailContent" class="detail-stack">
                        <div class="detail-hero-card">
                            <div id="groupDetailHeader" class="detail-header" style="display:none">
                                <img id="groupInfoAvatar" class="detail-header-avatar" alt="群头像" />
                                <div class="detail-header-info">
                                    <div id="groupInfoName" class="detail-header-name">未选择群</div>
                                    <div id="groupInfoSub" class="detail-header-sub"></div>
                                </div>
                            </div>
                            <div class="hero-metrics">
                                <div>
                                    <span>当前对象</span>
                                    <strong id="overviewActiveName">等待选择</strong>
                                </div>
                                <div>
                                    <span>策略覆盖</span>
                                    <strong id="overviewActiveSub">暂无数据</strong>
                                </div>
                            </div>
                            <div class="coverage-track"><i id="overviewProgressFill"></i></div>
                        </div>

                        <div id="enabledGroupsInfo" class="enabled-groups-info" style="display:none"></div>

                        <section class="plugin-config-card elevated-card">
                            <div class="section-head plugin-config-head">
                                <div>
                                    <div class="section-title">插件基础配置</div>
                                    <div class="section-hint">仅保留日志级别。修改后与当前群配置一并保存。</div>
                                </div>
                            </div>
                            <div id="globalConfigForm" class="form-stack"></div>
                        </section>

                        <section class="group-config-card elevated-card">
                            <div class="section-head group-config-head">
                                <div>
                                    <div class="section-title">群审核处置配置</div>
                                    <div class="section-hint">管理审核开关、通知、禁言、踢出和群级审核提示词。</div>
                                </div>
                            </div>
                            <div id="groupForm" class="form-stack"></div>
                        </section>

                        <div class="sticky-actions">
                            <button class="ghost-button" id="clearViolationsBtn" style="display:none">清除违规次数</button>
                            <button class="ghost-button danger-ghost" id="deleteGroupBtn" style="display:none">删除此群配置</button>
                            <button class="primary-button" id="saveGroupBtn">保存当前配置</button>
                        </div>
                    </div>
                </section>
            </div>
        </section>
    </div>

    <div class="toast-layer" id="toastLayer"></div>

    <div id="addGroupModal" class="modal-overlay" style="display:none">
        <div class="modal-card">
            <div class="modal-header">
                <div>
                    <div class="panel-kicker">新增策略</div>
                    <div class="modal-title">选择要添加配置的群</div>
                </div>
                <button class="modal-close" id="modalCloseBtn">&times;</button>
            </div>
            <label class="toolbar-field modal-search search-shell">
                <span class="search-icon">⌕</span>
                <input id="modalSearchInput" type="search" placeholder="搜索群名或群号" aria-label="搜索群" />
            </label>
            <div id="modalGroupList" class="modal-group-list">
                <div class="modal-loading">加载中...</div>
            </div>
            <div class="modal-footer">
                <button class="primary-button" id="modalConfirmBtn" disabled>确定添加</button>
            </div>
        </div>
    </div>

    <div id="deleteConfirmModal" class="modal-overlay" style="display:none">
        <div class="modal-card modal-card-sm">
            <div class="modal-header">
                <div class="modal-title">确认删除</div>
                <button class="modal-close" id="deleteConfirmCloseBtn">&times;</button>
            </div>
            <div class="modal-body" id="deleteConfirmBody">确定要删除此群配置吗？</div>
            <div class="modal-footer">
                <button class="ghost-button" id="deleteConfirmCancelBtn">取消</button>
                <button class="primary-button modal-danger-btn" id="deleteConfirmOkBtn">删除</button>
            </div>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
